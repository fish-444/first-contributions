<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🌱 잎 분류 (Gemini)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f0f4f0;
    color: #1f2a24;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 12px;
  }
  .app { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 1.4rem; color: #14532d; }
  .subtitle { font-size: .9rem; color: #4b5c52; margin-top: 4px; line-height: 1.5; }
  .card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 5px rgba(0,0,0,.07); }
  .section-title { font-size: .98rem; font-weight: 700; color: #14532d; margin-bottom: 10px; }
  label.field { display: block; font-size: .82rem; color: #4b5c52; margin-bottom: 4px; }
  input[type="text"], input[type="password"], select {
    width: 100%; padding: 9px 11px; border: 1px solid #cdd9d1;
    border-radius: 8px; font-size: .9rem; background: #fff;
  }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  button {
    background: #16a34a; color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: .95rem; cursor: pointer; font-weight: 600;
  }
  button:hover:not(:disabled) { background: #15803d; }
  button:disabled { background: #9ec9ac; cursor: wait; }
  button.secondary { background: #e5eae7; color: #374151; }
  button.secondary:hover:not(:disabled) { background: #d7ded9; }
  .hint { font-size: .78rem; color: #6b7c72; margin-top: 6px; line-height: 1.5; }
  .hint a { color: #16a34a; }
  #drop {
    border: 2px dashed #b6cabb; border-radius: 12px; padding: 26px;
    text-align: center; color: #6b7c72; cursor: pointer; transition: .15s;
    font-size: .9rem; background: #f7faf8;
  }
  #drop.drag { border-color: #16a34a; background: #eef7f0; color: #14532d; }
  .canvas-wrap { position: relative; margin-top: 14px; display: none; }
  .canvas-wrap.show { display: block; }
  #overlay { max-width: 100%; height: auto; border-radius: 10px; display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: .85rem; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .counts { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .count-box { flex: 1; min-width: 130px; border-radius: 10px; padding: 12px 14px; text-align: center; }
  .count-box .n { font-size: 1.6rem; font-weight: 800; }
  .count-box .l { font-size: .8rem; margin-top: 2px; }
  .cb-growing { background: #dcfce7; color: #166534; }
  .cb-mature { background: #fef3c7; color: #92400e; }
  .cb-total { background: #e0e7ff; color: #3730a3; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; margin-top: 12px; }
  th, td { border: 1px solid #e5eae7; padding: 6px 9px; text-align: left; }
  th { background: #f4f7f5; }
  .status { font-size: .88rem; margin-top: 12px; padding: 10px 12px; border-radius: 8px; line-height: 1.5; }
  .status.info { background: #eff6ff; color: #1e40af; }
  .status.error { background: #fef2f2; color: #991b1b; }
  .status.ok { background: #f0fdf4; color: #166534; }
  .toggle-row { display: flex; gap: 14px; align-items: center; margin-top: 10px; font-size: .85rem; color: #4b5c52; }
  .toggle-row label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>🌱 잎 성장 단계 분류기</h1>
    <div class="subtitle">
      식물 사진을 올리면 <b>Gemini</b>가 잎을 하나씩 <b>분리(SAM 역할)</b>하고,
      각 잎을 <b>성장중인 잎</b> / <b>성숙한 잎</b> 으로 <b>구분(YOLO 역할)</b>합니다.
    </div>
  </div>

  <!-- API 키 -->
  <div class="card">
    <div class="section-title">1. Gemini API 키</div>
    <div class="row">
      <div>
        <label class="field" for="apikey">API 키 (nvapi 아님 — <code>AIza...</code> 형식)</label>
        <input type="password" id="apikey" placeholder="여기에 Gemini API 키 붙여넣기" />
      </div>
      <div style="flex:0 0 auto; min-width:auto">
        <button class="secondary" id="save-key">키 저장</button>
      </div>
    </div>
    <div class="hint">
      키는 <b>이 브라우저에만</b> 저장되고 서버로 전송되지 않습니다.
      무료 키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> 에서 발급.
    </div>
    <div class="row" style="margin-top:12px">
      <div style="flex:0 0 auto; min-width:auto">
        <label class="field" for="model">모델</label>
        <select id="model" style="width:auto">
          <option value="gemini-2.5-flash" selected>gemini-2.5-flash (빠름·무료)</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro (정확·느림)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 이미지 -->
  <div class="card">
    <div class="section-title">2. 잎 사진 업로드</div>
    <div id="drop">클릭하거나 이미지를 여기로 끌어다 놓으세요 (jpg / png / webp)</div>
    <input type="file" id="file" accept="image/*" style="display:none" />

    <div class="toggle-row">
      <label><input type="checkbox" id="show-mask" checked /> 마스크(분리 영역) 표시</label>
      <label><input type="checkbox" id="show-box" checked /> 박스 표시</label>
    </div>

    <div class="row" style="margin-top:12px">
      <div style="flex:0 0 auto; min-width:auto">
        <button id="analyze" disabled>🔍 분석</button>
      </div>
      <div style="flex:0 0 auto; min-width:auto">
        <button class="secondary" id="clear">지우기</button>
      </div>
    </div>

    <div id="status"></div>

    <div class="canvas-wrap" id="cwrap">
      <canvas id="overlay"></canvas>
    </div>

    <div class="legend" id="legend" style="display:none">
      <span><i class="swatch" style="background:#22c55e"></i> 성장중인 잎</span>
      <span><i class="swatch" style="background:#f59e0b"></i> 성숙한 잎</span>
    </div>

    <div class="counts" id="counts" style="display:none">
      <div class="count-box cb-growing"><div class="n" id="n-growing">0</div><div class="l">성장중인 잎</div></div>
      <div class="count-box cb-mature"><div class="n" id="n-mature">0</div><div class="l">성숙한 잎</div></div>
      <div class="count-box cb-total"><div class="n" id="n-total">0</div><div class="l">전체</div></div>
    </div>

    <div id="table-wrap"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// 클래스 정의: 프롬프트로 보낼 라벨과 화면 색을 매핑
const GROWING = "growing leaf";   // 성장중인 잎 (어리고 연한 새 잎)
const MATURE  = "mature leaf";    // 성숙한 잎 (다 자란 진한 잎)
const COLORS = { [GROWING]: "#22c55e", [MATURE]: "#f59e0b" };
const KOR    = { [GROWING]: "성장중인 잎", [MATURE]: "성숙한 잎" };

let currentImage = null;   // <img> 원본
let lastResults = [];      // 마지막 분석 결과 (박스/마스크/라벨)

// --- API 키 로컬 저장 ---
const savedKey = localStorage.getItem("gemini_api_key");
if (savedKey) $("apikey").value = savedKey;
const savedModel = localStorage.getItem("gemini_model");
if (savedModel) $("model").value = savedModel;

$("save-key").addEventListener("click", () => {
  localStorage.setItem("gemini_api_key", $("apikey").value.trim());
  localStorage.setItem("gemini_model", $("model").value);
  setStatus("API 키를 이 브라우저에 저장했습니다.", "ok");
});
$("model").addEventListener("change", () =>
  localStorage.setItem("gemini_model", $("model").value)
);

function setStatus(msg, kind) {
  const el = $("status");
  if (!msg) { el.innerHTML = ""; return; }
  el.className = "status " + (kind || "info");
  el.textContent = msg;
}

// --- 파일 드롭/선택 ---
const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", (e) => {
  e.preventDefault(); drop.classList.remove("drag");
  if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});
$("file").addEventListener("change", (e) => {
  if (e.target.files[0]) loadImage(e.target.files[0]);
});

function loadImage(file) {
  if (!file.type.startsWith("image/")) { setStatus("이미지 파일만 올릴 수 있습니다.", "error"); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      currentImage = img;
      lastResults = [];
      drawBase();
      $("cwrap").classList.add("show");
      $("analyze").disabled = false;
      $("legend").style.display = "none";
      $("counts").style.display = "none";
      $("table-wrap").innerHTML = "";
      setStatus(`이미지 준비 완료 (${img.naturalWidth}×${img.naturalHeight}). "분석"을 누르세요.`, "info");
      drop.textContent = file.name + " — 다른 이미지를 올리려면 다시 클릭";
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function drawBase() {
  const cv = $("overlay");
  cv.width = currentImage.naturalWidth;
  cv.height = currentImage.naturalHeight;
  const ctx = cv.getContext("2d");
  ctx.drawImage(currentImage, 0, 0);
}

// --- 분석 실행 ---
$("analyze").addEventListener("click", analyze);
$("clear").addEventListener("click", () => {
  currentImage = null; lastResults = [];
  $("cwrap").classList.remove("show");
  $("analyze").disabled = true;
  $("legend").style.display = "none";
  $("counts").style.display = "none";
  $("table-wrap").innerHTML = "";
  drop.textContent = "클릭하거나 이미지를 여기로 끌어다 놓으세요 (jpg / png / webp)";
  setStatus("");
});
$("show-mask").addEventListener("change", render);
$("show-box").addEventListener("change", render);

async function analyze() {
  const key = $("apikey").value.trim();
  if (!key) { setStatus("먼저 Gemini API 키를 입력하세요.", "error"); return; }
  if (!currentImage) { setStatus("먼저 이미지를 올리세요.", "error"); return; }

  const btn = $("analyze");
  btn.disabled = true; btn.textContent = "분석 중…";
  setStatus("Gemini가 잎을 분리하고 성장 단계를 구분하는 중… (몇 초~수십 초)", "info");

  try {
    const base64 = canvasToBase64(currentImage);
    const results = await callGemini(key, $("model").value, base64);
    lastResults = await decodeMasks(results);
    render();
    updateCounts();
    if (lastResults.length === 0) {
      setStatus("잎을 찾지 못했습니다. 더 선명하거나 가까운 사진으로 다시 시도해 보세요.", "info");
    } else {
      setStatus(`분석 완료 — 잎 ${lastResults.length}개를 찾았습니다.`, "ok");
    }
  } catch (e) {
    console.error(e);
    setStatus("오류: " + e.message, "error");
  } finally {
    btn.disabled = false; btn.textContent = "🔍 분석";
  }
}

// 원본을 최대 1024px로 줄여 base64 JPEG 생성 (무료 티어 속도/용량 절약)
function canvasToBase64(img) {
  const MAX = 1024;
  let w = img.naturalWidth, h = img.naturalHeight;
  const scale = Math.min(1, MAX / Math.max(w, h));
  w = Math.round(w * scale); h = Math.round(h * scale);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  return c.toDataURL("image/jpeg", 0.9).split(",")[1];
}

// --- Gemini 호출 (세그멘테이션: box_2d + mask + label) ---
async function callGemini(key, model, base64Jpeg) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;

  const prompt =
    "You are a botany assistant. Look at this plant photo and find every individual leaf.\n" +
    "For EACH leaf, decide its growth stage and classify it as exactly one of:\n" +
    `- "${GROWING}": a young, growing leaf (small, soft, light/bright green, newly emerging, not fully expanded).\n` +
    `- "${MATURE}": a mature leaf (fully expanded, larger, darker/deeper green, firm).\n` +
    "Segment (separate) each leaf and output a JSON list. Each entry must contain:\n" +
    '"box_2d": [ymin, xmin, ymax, xmax] normalized to 0-1000,\n' +
    '"mask": the segmentation mask as a base64 PNG data URI for that box,\n' +
    `"label": either "${GROWING}" or "${MATURE}".\n` +
    "Return ONLY the JSON list, no extra text.";

  const body = {
    contents: [{
      parts: [
        { text: prompt },
        { inline_data: { mime_type: "image/jpeg", data: base64Jpeg } },
      ],
    }],
    generationConfig: { temperature: 0.1 },
  };

  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json())?.error?.message || ""; } catch {}
    if (res.status === 400 && /API key/i.test(detail))
      throw new Error("API 키가 올바르지 않습니다. 키를 다시 확인하세요.");
    if (res.status === 429)
      throw new Error("무료 한도를 초과했습니다. 잠시 후 다시 시도하세요.");
    throw new Error(`Gemini API 오류 (${res.status}) ${detail}`);
  }

  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts
    ?.map((p) => p.text || "").join("") || "";
  return parseJsonList(text);
}

// 모델 응답에서 JSON 배열만 뽑아 파싱 (```json 코드펜스 대응)
function parseJsonList(text) {
  let t = text.trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  const start = t.indexOf("[");
  const end = t.lastIndexOf("]");
  if (start !== -1 && end !== -1) t = t.slice(start, end + 1);
  try {
    const arr = JSON.parse(t);
    return Array.isArray(arr) ? arr : [];
  } catch {
    return [];
  }
}

// box_2d(0-1000)를 픽셀로 바꾸고, mask 데이터 URI를 Image로 디코드
async function decodeMasks(items) {
  const W = currentImage.naturalWidth, H = currentImage.naturalHeight;
  const out = [];
  for (const it of items) {
    if (!it || !Array.isArray(it.box_2d) || it.box_2d.length < 4) continue;
    const [ymin, xmin, ymax, xmax] = it.box_2d;
    const box = {
      x0: Math.round((xmin / 1000) * W),
      y0: Math.round((ymin / 1000) * H),
      x1: Math.round((xmax / 1000) * W),
      y1: Math.round((ymax / 1000) * H),
    };
    // 라벨 정규화: growing / mature 둘 중 하나로
    const raw = String(it.label || "").toLowerCase();
    const label = raw.includes("grow") || raw.includes("young") || raw.includes("성장")
      ? GROWING : MATURE;

    let maskImg = null;
    if (it.mask && typeof it.mask === "string") {
      const src = it.mask.startsWith("data:") ? it.mask : `data:image/png;base64,${it.mask}`;
      maskImg = await loadImg(src).catch(() => null);
    }
    out.push({ box, label, maskImg });
  }
  return out;
}

function loadImg(src) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = reject;
    im.src = src;
  });
}

// --- 화면 렌더링 (박스 + 마스크 오버레이) ---
function render() {
  if (!currentImage) return;
  drawBase();
  const ctx = $("overlay").getContext("2d");
  const showMask = $("show-mask").checked;
  const showBox = $("show-box").checked;

  for (const r of lastResults) {
    const color = COLORS[r.label];
    const bw = r.box.x1 - r.box.x0, bh = r.box.y1 - r.box.y0;

    // 마스크: 박스 영역에 맞춰 그린 뒤, 색으로 덧입혀 반투명 오버레이
    if (showMask && r.maskImg && bw > 0 && bh > 0) {
      const tmp = document.createElement("canvas");
      tmp.width = bw; tmp.height = bh;
      const tctx = tmp.getContext("2d");
      tctx.drawImage(r.maskImg, 0, 0, bw, bh);      // 마스크(밝기=확률)
      tctx.globalCompositeOperation = "source-in";  // 마스크 모양만 남기고 색 채우기
      tctx.fillStyle = color;
      tctx.fillRect(0, 0, bw, bh);
      ctx.globalAlpha = 0.45;
      ctx.drawImage(tmp, r.box.x0, r.box.y0);
      ctx.globalAlpha = 1;
    }

    // 박스 + 라벨
    if (showBox) {
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2, Math.round(currentImage.naturalWidth / 400));
      ctx.strokeRect(r.box.x0, r.box.y0, bw, bh);

      const text = KOR[r.label];
      ctx.font = `${Math.max(14, Math.round(currentImage.naturalWidth / 45))}px sans-serif`;
      const pad = 4, tw = ctx.measureText(text).width;
      const th = parseInt(ctx.font, 10) + pad;
      ctx.fillStyle = color;
      ctx.fillRect(r.box.x0, Math.max(0, r.box.y0 - th), tw + pad * 2, th);
      ctx.fillStyle = "#fff";
      ctx.fillText(text, r.box.x0 + pad, Math.max(th - pad - 2, r.box.y0 - pad - 2));
    }
  }
  $("legend").style.display = lastResults.length ? "flex" : "none";
}

function updateCounts() {
  const g = lastResults.filter((r) => r.label === GROWING).length;
  const m = lastResults.filter((r) => r.label === MATURE).length;
  $("n-growing").textContent = g;
  $("n-mature").textContent = m;
  $("n-total").textContent = g + m;
  $("counts").style.display = lastResults.length ? "flex" : "none";

  if (!lastResults.length) { $("table-wrap").innerHTML = ""; return; }
  let html = "<table><tr><th>#</th><th>구분</th><th>박스 [x0, y0, x1, y1]</th></tr>";
  lastResults.forEach((r, i) => {
    html += `<tr><td>${i + 1}</td><td>${KOR[r.label]}</td>` +
            `<td>${r.box.x0}, ${r.box.y0}, ${r.box.x1}, ${r.box.y1}</td></tr>`;
  });
  html += "</table>";
  $("table-wrap").innerHTML = html;
}
</script>
</body>
</html>
